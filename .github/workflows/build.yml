name: Build FBNeo (Windows)

# Builds fbneo_libretro.dll for Windows with the mingw-w64 cross-compiler on
# an Ubuntu runner. Assumes the auto-load-state changes are already committed
# in this fork (see AUTOLOAD_GUIDE.md).
#
# NOTE: FBNeo is huge - a full build takes roughly 45-90 minutes per arch.
# That is well within the GitHub Actions job limit; just be patient.
#
# Triggers: every push/PR, manual runs, and tag pushes like "v1.0"
# (a tag push also publishes a GitHub Release with the DLL attached).

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            triple: x86_64-w64-mingw32
          - arch: i686
            triple: i686-w64-mingw32
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 make

      - name: Build core
        run: |
          cd src/burner/libretro
          make -f Makefile \
            platform=win \
            CC=${{ matrix.triple }}-gcc \
            CXX=${{ matrix.triple }}-g++ \
            -j"$(nproc)"

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp src/burner/libretro/fbneo_libretro.dll "dist/fbneo_libretro_${{ matrix.arch }}.dll"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fbneo_libretro_${{ matrix.arch }}
          path: dist/fbneo_libretro_${{ matrix.arch }}.dll
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fbneo_libretro_${{ matrix.arch }}.dll
