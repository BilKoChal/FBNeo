# fbneo_libretro.cfg
# Auto-load-save-state settings for the FBNeo (FinalBurn Neo) libretro core.
#
# IMPORTANT: this file must
#   - be named exactly like the core but with a .cfg extension
#     (core = fbneo_libretro.dll  ->  config = fbneo_libretro.cfg)
#   - sit in the SAME folder as fbneo_libretro.dll
#
# When enabled, on the first frame after a ROM loads the core loads:
#
#     <save_path>\<rom-name-without-extension>.<state_ext>
#
# Lines starting with # or ; are ignored.

# Enable (1/true/yes/on) or disable (0/false/no/off) the feature.
enabled = 1

# Save-state folder(s). You can list MULTIPLE save_path lines - the core tries
# them top-to-bottom and loads the FIRST folder that contains a matching state.
# FBNeo runs arcade plus many consoles, so list each system folder you use.
save_path = G:\RetroBat\saves\fbneo
save_path = G:\RetroBat\saves\neogeo\libretro.fbneo
save_path = G:\RetroBat\saves\mastersystem\libretro.fbneo

# State file extension appended after the ROM name (no leading dot needed).
# Examples:  state.auto   state   state1   state2
state_ext = state.auto
